<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clinify | Perfil do estudante: ambiente educacional Clinify para aprendizagem e prática clínica.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/clinify.svg">

    <title>Clinify | Perfil do estudante</title>


    <link rel="stylesheet" href="../assets/css/root.css">
    <link rel="stylesheet" href="../assets/css/estrutura.css">

</head>

<body class="pagina-painel" data-area="estudante">
    <div class="app-shell">
        <aside class="sidebar">
            <button class="sidebar__toggle" type="button" data-sidebar-collapse aria-label="Recolher menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
            </button>
            <div class="sidebar__brand">
                <span class="sidebar__mark"><img src="../assets/img/clinify.svg" alt="" width="38" height="38"></span>
                <span class="sidebar__brand-text">
                    <span class="sidebar__eyebrow">Hospital Moinhos de Vento</span>
                    <span class="sidebar__wordmark">Clinify</span>
                </span>
            </div>
            <nav aria-label="Navegação principal"><ul class="sidebar__nav" data-navigation></ul></nav>
        </aside>
        <div class="sidebar__backdrop" data-sidebar-backdrop></div>
        <div class="app-main">
            <header class="topbar">
                <button class="topbar__menu-btn" type="button" data-sidebar-mobile-toggle aria-label="Abrir menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="20" y2="17" /></svg>
                </button>
                <div class="topbar__spacer"></div>
                <a href="perfil.html" class="topbar__avatar is-active" aria-label="Meu perfil" title="Meu perfil"><span class="topbar__avatar-initials">ES</span></a>
            </header>
            <main class="panel-page perfil-estudante">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Meu perfil</h1>
                        <p class="page-subtitle">Seu perfil, sua evolução e suas conquistas.</p>
                    </div>
                </div>
                <div class="perfil-organizacao">
                <form class="stat-card profile-card" data-profile-form>
                    <div class="profile-summary">
                        <div class="profile-avatar">ES</div>
                        <div>
                            <p class="profile-name">Estudante Clinify</p>
                            <p class="profile-email">12345678900@gmail.com</p>
                        </div>
                    </div>
                    <a class="perfil-colecao-link" href="#colecao-icones">Escolher ícone do perfil</a>
                    <h2 class="perfil-dados-titulo">Seus dados</h2>
                    <div class="modal-field">
                        <label for="perfil-nome">Nome</label>
                        <input type="text" id="perfil-nome" required minlength="2" autocomplete="name" value="Estudante Clinify">
                    </div>
                    <div class="modal-field">
                        <label for="perfil-email">E-mail</label>
                        <input type="email" id="perfil-email" required autocomplete="email" value="12345678900@gmail.com">
                    </div>
                    <button type="submit" class="btn btn--primary">Salvar alterações</button>
                </form>
                <section id="colecao-icones" class="jornada-card" tabindex="-1" data-jornada aria-label="Níveis e conquistas"></section>
                </div>
            </main>
        </div>
    </div>
    <script src="../assets/js/shared/components.js"></script>
    <script src="../assets/js/shared/interactions.js"></script>
    <script src="../assets/js/shared/layout.js"></script>
    <script src="../assets/js/student/progress.js"></script>
    <script src="../assets/js/shared/profile.js"></script>
</body>

</html>
